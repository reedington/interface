server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Keep the independent UI and its API on one loopback origin. Nothing is proxied
    # to a public Mifos demonstration server or a cloud service.
    location /fineract-provider/ {
        proxy_pass http://fineract:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /assets/env.js {
        add_header Cache-Control 'no-store';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
